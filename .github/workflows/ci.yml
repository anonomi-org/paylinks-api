name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Lifecycle scripts from dependencies are not needed to install this
      # project, and not running them keeps a compromised package from
      # executing during CI.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Type-check (src and tests)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
